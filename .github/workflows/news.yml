name: UTT Noticias de Prensa

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Buscar noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_core.py --news

      - name: Regenerar dashboard
        run: python generate_roster_html.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news.json intel/ captions_log.json docs/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualizar noticias + dashboard [bot]"
          git push
