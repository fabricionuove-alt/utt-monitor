name: UTT Instagram Monitor

on:
  schedule:
    - cron: "0 */8 * * *"   # cada 8 horas
  workflow_dispatch:

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Monitorear Instagram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_core.py --instagram

      - name: Guardar estado y perfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_instagram.json intel/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualizar intel jugadores + Instagram [bot]"
          git push
