name: UTT Monitor

on:
  schedule:
    - cron: "0 */4 * * *"   # partidos: cada 4 horas
    - cron: "0 9 * * *"     # cumpleaños + fixtures: todos los días a las 9am UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecución"
        required: false
        default: "check"
        type: choice
        options: [check, birthdays, demo]

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr bot
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_core.py --${{ inputs.mode || 'check' }}
      - name: Regenerar dashboard
        run: python generate_roster_html.py
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add captions_log.json intel/ docs/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualizar eventos + dashboard [bot]"
          git push

  birthdays:
    if: github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chequear cumpleaños
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_core.py --birthdays
      - name: Fetch partidos hoy y mañana
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python fetch_today_fixtures.py
      - name: Regenerar dashboard
        run: python generate_roster_html.py
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add captions_log.json today_fixtures.json intel/ docs/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualizar cumpleaños + partidos + dashboard [bot]"
          git push
